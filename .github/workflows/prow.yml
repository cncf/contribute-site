name: Prow

# Chat-ops via cncf/prow-github-actions; configuration in .github/prow.yaml,
# authorization in the OWNERS files.
# https://github.com/cncf/prow-github-actions/blob/main/docs/installing.md
#
# pull_request mode (no pull_request_target): fork PRs get a read-only token on
# pull_request events, so the 5-minute sweep job handles their OWNERS reviewers,
# approval and merge instead. Comment commands (/lgtm, /approve, ...) run with
# a write token on forks too and take effect immediately.

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  check_suite:
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  # label-sync: run once after installing, then whenever .github/prow.yaml changes
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/prow.yaml]

# the reusable workflow can use at most what is granted here
permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  actions: write

# One run per comment; per event+action for everything else.
# Never cancel a run that may be merging.
concurrency:
  group:
    prow-${{ github.event_name }}-${{ github.event.action }}-${{
    github.event.comment.id || github.event.pull_request.number ||
    github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  prow:
    if: >-
      github.repository == 'cncf/contribute-site' && github.event_name !=
      'workflow_dispatch' && github.event_name != 'push' && github.event_name !=
      'schedule'
    uses: cncf/prow-github-actions/.github/workflows/prow.yml@187c5e3cd95a329c43448e1bdb3b1f5249232e44 # v3.0.1

  sweep:
    if:
      github.repository == 'cncf/contribute-site' && github.event_name ==
      'schedule'
    uses: cncf/prow-github-actions/.github/workflows/prow.yml@187c5e3cd95a329c43448e1bdb3b1f5249232e44 # v3.0.1
    with:
      jobs: sweep lgtm

  label-sync:
    if: >-
      github.repository == 'cncf/contribute-site' && (github.event_name ==
      'workflow_dispatch' || github.event_name == 'push')
    uses: cncf/prow-github-actions/.github/workflows/prow.yml@187c5e3cd95a329c43448e1bdb3b1f5249232e44 # v3.0.1
    with:
      jobs: label-sync
